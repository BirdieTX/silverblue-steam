---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silverblue-steam
description: Custom Silverblue images forked from birdietx/silverblue with steam installed.
base-image: ghcr.io/birdietx/silverblue
image-version: latest

modules:

  - type: script
    scripts:
    - repo-enable.sh

  - type: dnf
    install:
      packages:
        - gamescope
        - steam

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.brave.Browser
          - com.github.neithern.g4music
          - com.github.tchx84.Flatseal
          - com.mattjakeman.ExtensionManager
          - com.saivert.pwvucontrol
          - com.vixalien.sticky
          - io.missioncenter.MissionCenter
          - org.gnome.baobab
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Decibels
          - org.gnome.font-viewer
          - org.gnome.Logs
          - org.gnome.Loupe
          - org.gnome.Papers
          - org.gnome.Showtime
          - org.gnome.SimpleScan
          - org.gnome.Snapshot
          - org.gnome.TextEditor
          - org.gnome.Weather
          - org.libreoffice.LibreOffice

  - type: script
    scripts:
      - repo-disable.sh
  - type: signing
